name: template-checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Placeholder check
        run: |
          TARGETS=(
            "README.md"
            "PROJECT_START_PROMPT.md"
            "pom.xml"
            "src"
            "scripts"
            "docs/00_プロジェクト管理"
            "docs/20_要件定義"
            "docs/30_基本設計"
            "docs/40_詳細設計"
            ".github/PULL_REQUEST_TEMPLATE.md"
          )
          if grep -R -n -e "{{" -e "}}" "${TARGETS[@]}"; then
            echo "placeholder start token found"
            exit 1
          fi

      - name: Run Maven Wrapper tests
        run: |
          chmod +x ./mvnw
          ./mvnw test

      - name: Run task index check
        run: python scripts/check_tsk_index_consistency.py

      - name: Run AI evidence check
        run: python scripts/check_ai_repo_result.py .github/PULL_REQUEST_TEMPLATE.md

      - name: Run prompt git safety check
        run: python scripts/test_codex_prompt_git_safety.py

  windows-wrapper-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Windows Maven Wrapper tests
        shell: pwsh
        run: .\mvnw.cmd test
